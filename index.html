<template id="sec-about">
  <article class="card"><h2>What Mission Note is</h2><p>Mission Note is a private rich-text notebook for a small community. Write with bold, colours, lists, headings and links, and keep every note safe on your phone.</p></article>
  <article class="card"><h2>Device and Cloud</h2><p><b>Device</b> keeps your notes on this phone so they open without internet. <b>Cloud</b> keeps a backup copy you choose to push, so you can recover notes after clearing browser data or reinstalling the app.</p></article>
  <article class="card"><h2>Private by design</h2><p>Only approved members can write. Your notes are never uploaded automatically: you decide what goes to Cloud.</p></article>
  <article class="card"><h2>Version</h2><p>Mission Note 1.0.0</p></article>
</template>

<template id="sec-howto">
  <article class="card"><h2>1. Join</h2><p>Tap Signup, fill in the form and enter the six-digit code sent to your email. The administrator then reviews your account. Approval can take up to five hours.</p></article>
  <article class="card"><h2>2. Write</h2><p>Open Editor and use the toolbar: bold, italic, underline, headings, size, colour, highlight, lists, indent, links, undo, redo and clear formatting.</p></article>
  <article class="card"><h2>3. Save to Device or Push to Cloud</h2><p>Tap Save, name your note and choose a destination. Device is instant and works offline. Cloud backs the note up so you can restore it later.</p></article>
  <article class="card"><h2>4. Find your notes</h2><p>Open Files to search names and contents, switch between list and grid, and open the three-dot menu on any note for Rename, Open, PIN, Delete, Copy Out, Push to Cloud, Export and Share.</p></article>
  <article class="card"><h2>5. Lock with a PIN</h2><p>A four-digit PIN locks a note on this phone. It is not Cloud encryption. If you forget it, delete the local copy and restore the note from Cloud.</p></article>
  <article class="card"><h2>6. Recover notes</h2><p>After clearing data or reinstalling, log in. Your Cloud notes are restored to this phone automatically.</p></article>
</template>

<template id="sec-terms">
  <article class="card"><h2>Membership</h2><p>Mission Note is for approved members of this community. Do not share your login. The administrator may approve, reject, disable or ban accounts.</p></article>
  <article class="card"><h2>Your content</h2><p>You own your notes. Do not store unlawful, abusive or infringing content. Notes you push to Cloud are stored with the service operator and can be removed to protect the community.</p></article>
  <article class="card"><h2>Availability</h2><p>The service is provided as is. Features may change, pause for maintenance or be withdrawn. Keep important notes backed up with Export.</p></article>
  <article class="card"><h2>Privacy</h2><p>We collect basic usage analytics (approximate location, device type and language) up to four times a day to improve the app. We do not read your notes except when needed for support or safety.</p></article>
</template>
